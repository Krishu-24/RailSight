# RailSight runtime configuration (inference pipeline + demo)

models:
  seg_weights: runs/seg/segformer-b2/best          # HF folder saved by scripts/train/train_seg.py
  det_weights: runs/det/yolo11m_rail_v2_960/weights/best.pt   # v2 (+ RailSem19 cab-view boxes, rail_vehicle
                          # class) fine-tuned at 960 px: best cab-view mAP, <1 FPS slower than 640 px
  device: cuda
  seg_precision: bf16     # bf16 for SegFormer-B2 / DeepLab; fp32 is faster for the tiny SegFormer-B0
  det_conf: 0.30
  det_imgsz: 960
  det_half: true          # fp16 detector: same test mAP, faster on GPU

camera:
  hfov_deg: 60.0          # assumed horizontal field of view when intrinsics are unknown
  ignore_below: null      # fraction of image height below which the view shows the train itself
                          # (dashboard, hood), e.g. 0.72; set once per camera mounting
  ignore_regions: []      # more such regions as [x0, y0, x1, y1] fractions, e.g. the side of the
                          # coach for a camera mounted at the door: [[0.8, 0, 1, 1]]

track:
  gauge_m: 1.435          # 1.435 standard gauge, 1.676 Indian broad gauge
  rail_head_m: 0.072      # the track mask spans outer rail edges = gauge + one rail-head width
  rail_pairs: false       # experimental: measure gauge between the two ego rails; helps at
                          # merged switches but picks wrong rail pairs elsewhere (mixed on RailSem19)
  train_width_m: 3.2      # kinematic envelope of the rolling stock
  side_margin_m: 0.5      # extra clearance on each side of the envelope
  seg_every_n: 3          # re-run segmentation every N frames (corridor changes slowly)
  smoothing: 0.6          # EMA weight on the previous corridor fit (0 = no smoothing)

train:
  speed_kmh: 60.0
  reaction_s: 2.0         # driver + system reaction time
  decel_mps2: 1.0         # emergency braking deceleration

risk:
  stop_margin_m: 50.0     # safety buffer added to the stopping distance
  max_range_m: 1000.0     # ignore objects estimated further than this
  near_buffer_m: 2.0      # lateral zone beside the corridor treated as "near"
  escalate_frames: 3      # frames needed to raise the alert level
  deescalate_frames: 15   # frames needed to lower it again

anomaly:
  enabled: true
  min_track_conf: 0.70    # skip the check when the model is unsure of the track itself (darkness,
                          # glare, blur): daylight clips score 0.8-0.98, a dark tunnel 0.47-0.68
  half_width_m: 1.0       # search only the track bed itself (between and just beside the rails)
  persist_updates: 3      # an unknown object must appear on 3 consecutive segmentation updates
                          # (~0.3 s at 30 fps) before it counts; filters glare / far-range flicker
  min_size_m: 0.3         # an unknown object must be at least this wide at its distance
  min_area_px: 30         # absolute floor against pixel noise
  conf_threshold: 0.0     # 0 = only non-ground classes count; low-confidence pixels add false
                          # alarms on class boundaries (see scripts/eval/eval_scene.py)
