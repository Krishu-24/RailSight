name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The unit tests cover geometry, risk logic and metrics, which need no deep-learning stack,
      # so CI skips the multi-GB CUDA PyTorch install from the lockfile.
      - name: Install test dependencies
        run: pip install numpy opencv-python-headless pyyaml pytest ruff
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: python -m pytest -q
        env:
          PYTHONPATH: ${{ github.workspace }}
